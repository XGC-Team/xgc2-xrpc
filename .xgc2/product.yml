schema: xgc2.product.v1
id: xgc2-xrpc
name: XGC2 XRPC SDKs
version: 0.2.0-1
kind: toolchain-apt
summary: Bounded http.v1, grpc.v1 and udp.v1 transport SDKs. Ubuntu 18.04 (bionic) gets the udp.v1 C++ library only; focal, jammy and noble get every C++ component and the Node and TypeScript libraries.
apt:
  distribution: bionic,focal,jammy,noble
  install:
  - libxgc2-xrpc-udp-dev
  - libxgc2-xrpc-dev
  - libxgc2-xrpc-grpc-dev
  - node-xgc2-xrpc
  - node-xgc2-xrpc-client
  packages:
  - libxgc2-xrpc-udp1
  - libxgc2-xrpc-udp-dev
  - libxgc2-xrpc2
  - libxgc2-xrpc-dev
  - libxgc2-xrpc-grpc2
  - libxgc2-xrpc-grpc-dev
  - node-xgc2-xrpc
  - node-xgc2-xrpc-client
  package_distributions:
    libxgc2-xrpc-udp1:
    - bionic
    - focal
    - jammy
    - noble
    libxgc2-xrpc-udp-dev:
    - bionic
    - focal
    - jammy
    - noble
    libxgc2-xrpc2:
    - focal
    - jammy
    - noble
    libxgc2-xrpc-dev:
    - focal
    - jammy
    - noble
    libxgc2-xrpc-grpc2:
    - focal
    - jammy
    - noble
    libxgc2-xrpc-grpc-dev:
    - focal
    - jammy
    - noble
    node-xgc2-xrpc:
    - focal
    - jammy
    - noble
    node-xgc2-xrpc-client:
    - focal
    - jammy
    - noble
  depends:
  - nlohmann-json3-dev (>= 3.7)
  - libgrpc++-dev (>= 1.16)
  - libprotobuf-dev
usage:
  install: sudo apt install libxgc2-xrpc-udp-dev libxgc2-xrpc-dev libxgc2-xrpc-grpc-dev node-xgc2-xrpc node-xgc2-xrpc-client
  smoke_test: cmake --find-package -DNAME=XgcXrpc -DCOMPILER_ID=GNU -DLANGUAGE=CXX -DMODE=EXIST
  notes: C++ is C++17 and one shared library per component, found with find_package(XgcXrpc COMPONENTS ...). libxgc2-xrpc-udp-dev is the root development package (CMake package files, the udp.v1 library and the header-only method router) and is the only C++ package on Ubuntu 18.04; XgcXrpc::json_http, XgcXrpc::http and XgcXrpc::grpc come with libxgc2-xrpc-dev and libxgc2-xrpc-grpc-dev on focal, jammy and noble. The runtime packages carry the SOVERSION generation (libxgc2-xrpc-udp1, libxgc2-xrpc2, libxgc2-xrpc-grpc2). Python wheel, Go source archive, Rust crate and the Node and TypeScript npm tarballs install through their native package managers and all carry the product version (0.2.0). Python uses an explicitly selected interpreter >=3.8. The Architecture all packages node-xgc2-xrpc and node-xgc2-xrpc-client install the same Node libraries (the first with a private pinned ws, the second without dependencies); consumers provide an explicitly selected Node >=20 runtime. Their installation identities are recorded in /usr/share/xgc2/xrpc/node/install-identity.json and /usr/share/xgc2/xrpc/ts/install-identity.json.
ownership:
  paths:
  - /usr/include/xgc2/xrpc
  - /usr/lib/*/libxgc2_xrpc_*.so*
  - /usr/lib/*/cmake/XgcXrpc
  - /usr/lib/xgc2/node_modules/@xgc2/xrpc
  - /usr/lib/xgc2/node_modules/@xgc2/xrpc-client
  - /usr/share/xgc2/xrpc/node/install-identity.json
  - /usr/share/xgc2/xrpc/ts/install-identity.json
  - /usr/share/doc/libxgc2-xrpc-udp1
  - /usr/share/doc/libxgc2-xrpc-udp-dev
  - /usr/share/doc/libxgc2-xrpc2
  - /usr/share/doc/libxgc2-xrpc-dev
  - /usr/share/doc/libxgc2-xrpc-grpc2
  - /usr/share/doc/libxgc2-xrpc-grpc-dev
  - /usr/share/doc/node-xgc2-xrpc
  - /usr/share/doc/node-xgc2-xrpc-client
release:
  repository: XGC-Team/xgc2-xrpc
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  requires: []
  dependency_policy: {}
  apt_versions:
    bionic: 0.2.0-1~bionic
    focal: 0.2.0-1~focal
    jammy: 0.2.0-1~jammy
    noble: 0.2.0-1~noble
