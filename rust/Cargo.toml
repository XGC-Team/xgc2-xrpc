[package]
name = "xgc2-xrpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bounded XGC2 HTTP hosts and clients over private Unix sockets, with Unix endpoint ownership and a C host ABI"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
