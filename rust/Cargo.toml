[package]
name = "xgc2-xrpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bounded XGC2 HTTP and optional native gRPC hosts, clients and Unix endpoint ownership"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }

[dev-dependencies]
tempfile = "3"
prost = "0.13"

[features]
default = []
grpc = ["dep:tonic", "dep:tower", "dep:tokio-stream", "dep:prost"]

[dependencies.prost]
version = "0.13"
optional = true

[dependencies.tonic]
version = "0.12"
optional = true
features = ["transport", "tls"]

[dependencies.tower]
version = "0.4"
optional = true
features = ["util", "limit", "timeout"]

[dependencies.tokio-stream]
version = "0.1"
optional = true
features = ["net"]
