name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
concurrency:
  group: xrpc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-debs:
    strategy:
      fail-fast: false
      matrix:
        suite: [focal, jammy, noble]
        arch: [amd64, arm64]
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
          - {suite: focal, image: 'ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic@sha256:fce2d76fddf4f6439bf0a188249b731650febdc163befc360bed186b269d252a'}
          - {suite: jammy, image: 'ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-full-humble@sha256:784dc2690d63b62ad2ec3cfdac12bf63c5931247c7ae816de8f73d336e0dc9a5'}
          - {suite: noble, image: 'ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-full-jazzy@sha256:aeb658acc5e40f5aad5caeb61c6aa5511a23b2111a28e88e7453defa02a32104'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and install SDK artifacts
        env:
          IMAGE: ${{ matrix.image }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME \
            -e GITHUB_REPOSITORY -e GITHUB_WORKFLOW_REF \
            -e RUNNER_TEMP=/out \
            -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/out" -w /work \
            "$IMAGE" bash .xgc2/scripts/build-ci.sh "$SUITE"
      - uses: actions/upload-artifact@v4
        with:
          name: xgc2-xrpc-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: .ci/artifacts/
          include-hidden-files: true
          retention-days: 14
