// Vendored from https://github.com/googleapis/googleapis
// (google/rpc/error_details.proto), reduced to ErrorInfo with the
// language-specific file options removed. Used only by the C++ tests, to check
// the hand-written wire handling of the application-error marker against
// generated code. It is not part of the installed SDK.

syntax = "proto3";

package google.rpc;

// Describes the cause of the error with structured details.
message ErrorInfo {
  // The reason of the error. This is a constant value that identifies the
  // proximate cause of the error.
  string reason = 1;

  // The logical grouping to which the "reason" belongs.
  string domain = 2;

  // Additional structured details about this error.
  map<string, string> metadata = 3;
}
