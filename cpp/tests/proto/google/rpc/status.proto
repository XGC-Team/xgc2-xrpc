// Vendored from https://github.com/googleapis/googleapis (google/rpc/status.proto)
// with the language-specific file options removed. Used only by the C++ tests,
// to check the hand-written wire handling of the application-error marker
// against generated code. It is not part of the installed SDK.

syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

// The `Status` type defines a logical error model that is suitable for
// different programming environments, including REST APIs and RPC APIs.
message Status {
  // The status code, which should be an enum value of
  // [google.rpc.Code][google.rpc.Code].
  int32 code = 1;

  // A developer-facing error message.
  string message = 2;

  // A list of messages that carry the error details.
  repeated google.protobuf.Any details = 3;
}
